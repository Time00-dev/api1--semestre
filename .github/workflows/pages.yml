name: Publicar frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Compilar painel
        env:
          VITE_DATA_URL: ${{ vars.PAGES_API_URL }}
          VITE_ANALYSIS_URL: ${{ vars.PAGES_ANALYSIS_URL }}
        run: |
          test -n "$VITE_DATA_URL" || { echo "Defina PAGES_API_URL com a URL HTTPS da API."; exit 1; }
          npm run build
          npm run check:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
