name: Publicar frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Compilar painel
        env:
          VITE_DATA_URL: ${{ vars.PAGES_API_URL }}
          VITE_ANALYSIS_URL: ${{ vars.PAGES_ANALYSIS_URL }}
        run: |
          test -n "$VITE_DATA_URL" || { echo "Defina PAGES_API_URL com a URL HTTPS da API."; exit 1; }
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v5
        id: deploy
